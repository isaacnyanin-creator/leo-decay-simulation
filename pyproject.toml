[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-decay"
version = "0.1.0"
description = "Reproduction of an empirically calibrated LEO orbital-decay ODE (Hubble, ISS, NOAA-15)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "sgp4",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]
dashboard = ["streamlit"]
spacetrack = ["spacetrack>=2.1", "python-dotenv"]
browser = ["playwright"]   # then: python -m playwright install chromium

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-ra -m 'not browser'"
markers = ["browser: end-to-end checks in headless Chromium (opt in with -m browser)"]
